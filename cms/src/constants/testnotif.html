<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Notification Sender</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Test Notification Sender</h1>
    
    <div class="form-group">
        <label for="userId">User ID:</label>
        <input type="text" id="userId" placeholder="Enter the user's Firebase UID">
    </div>
    
    <div class="form-group">
        <label for="title">Notification Title:</label>
        <input type="text" id="title" placeholder="Enter notification title" value="Test Notification">
    </div>
    
    <div class="form-group">
        <label for="body">Notification Body:</label>
        <textarea id="body" placeholder="Enter notification message" rows="3">This is a test notification from the web admin panel.</textarea>
    </div>
    
    <div class="form-group">
        <label for="notificationType">Notification Type:</label>
        <select id="notificationType">
            <option value="TEST">Test Notification</option>
            <option value="APPOINTMENT_CONFIRMED">Appointment Confirmed</option>
            <option value="SESSION_UPDATE">Session Update</option>
            <option value="FOLLOW_UP">Follow-up Reminder</option>
        </select>
    </div>
    
    <button id="sendBtn">Send Notification</button>
    
    <div id="result" class="result" style="display: none;"></div>
    
    <script>
        // Initialize Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyCWPK6YOK65w1mSVh969SN-3Jkprd2VPTU",
          authDomain: "counseling-management-system.firebaseapp.com",
          projectId: "counseling-management-system",
          storageBucket: "counseling-management-system.firebasestorage.app",
          messagingSenderId: "662850750993",
          appId: "1:662850750993:web:38ec747e0f2d68e99ebfb0",
          measurementId: "G-X127R0S4KM",
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        document.getElementById('sendBtn').addEventListener('click', async function() {
            const userId = document.getElementById('userId').value.trim();
            const title = document.getElementById('title').value.trim();
            const body = document.getElementById('body').value.trim();
            const notificationType = document.getElementById('notificationType').value;
            
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result';
            resultDiv.style.display = 'none';
            
            if (!userId) {
                showResult('Please enter a user ID.', 'error');
                return;
            }
            
            if (!title) {
                showResult('Please enter a notification title.', 'error');
                return;
            }
            
            if (!body) {
                showResult('Please enter a notification body.', 'error');
                return;
            }
            
            try {
                // Create notification document in Firestore
                const notificationData = {
                    userId: userId,
                    title: title,
                    body: body,
                    data: {
                        type: notificationType,
                        timestamp: Date.now()
                    },
                    read: false,
                    sent: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                const docRef = await db.collection('notifications').add(notificationData);
                
                showResult(`Notification created successfully! Document ID: ${docRef.id}`, 'success');
            } catch (error) {
                console.error('Error sending notification:', error);
                showResult(`Error: ${error.message}`, 'error');
            }
        });
        
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = message;
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
